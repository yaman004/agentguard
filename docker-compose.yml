services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  server:
    build: ./server
    ports: ["4000:4000"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/agentguard
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
  client:
    build:
      context: ./client
      args: { VITE_API_URL: "http://localhost:4000" }
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  mongo-data:
